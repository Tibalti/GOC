<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📡 3급통신사(GOC) 면접 암기</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#f1f5f9;color:#0f172a}
header{background:#1e3a8a;color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0 0 8px;font-size:18px}
.bar{height:8px;background:#ffffff40;border-radius:4px;overflow:hidden}
.bar>div{height:100%;background:#4ade80;transition:width .3s}
#stats{font-size:13px;margin-top:6px}
nav{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #e2e8f0;align-items:center;font-size:14px}
select,button{font-size:14px;padding:7px 10px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;cursor:pointer;color:inherit}
main{max-width:780px;margin:18px auto 60px;padding:0 12px}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 14px #0000000f;margin-bottom:14px}
.meta{font-size:12px;color:#64748b;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.q{font-size:18px;font-weight:700;margin-bottom:14px;line-height:1.5}
.a{white-space:pre-wrap;line-height:2;font-size:16px;border-top:1px dashed #cbd5e1;padding-top:12px;word-break:keep-all}
.b{color:#1d4ed8}.k{color:#334155}
.cv{background:#1d4ed8;color:transparent;border-radius:4px;cursor:pointer;user-select:none}
.cv.k2{background:#64748b}
.cv.open{background:#dbeafe;color:#1d4ed8}
.cv.k2.open{background:#e2e8f0;color:#334155}
.hit{color:#15803d}
.miss{color:#dc2626;background:#fee2e2;text-decoration:underline}
.note{margin-top:12px;font-size:13px;color:#64748b;background:#f8fafc;border-radius:8px;padding:8px 10px;white-space:pre-wrap}
textarea{width:100%;min-height:150px;font-size:16px;padding:10px;border-radius:10px;border:2px solid #93c5fd;font-family:inherit;line-height:1.6}
.btns{display:flex;gap:10px;margin-top:16px}
.btns button{flex:1;padding:13px;font-size:16px;font-weight:700;border:none;color:#fff;background:#1e3a8a}
.btns .no{background:#dc2626}.btns .yes{background:#16a34a}.btns .sub{background:#64748b}
.result{margin-top:10px;font-weight:700}
.empty{text-align:center;font-size:18px;padding:40px}
.lv{padding:1px 8px;border-radius:10px;background:#e0e7ff;color:#3730a3;font-weight:700}
.tts{border:none;background:none;font-size:18px;padding:0 4px}
</style>
</head>
<body>
<header>
  <h1>📡 3급통신사(GOC) 면접 암기</h1>
  <div class="bar"><div id="pbar" style="width:0"></div></div>
  <div id="stats"></div>
</header>
<nav>
  <select id="cat"></select>
  <select id="mode">
    <option value="cloze">🙈 가리개</option>
    <option value="type">⌨️ 받아쓰기</option>
    <option value="list">📖 목록 복습</option>
  </select>
  <select id="level">
    <option value="0.3">가림 30%</option>
    <option value="0.6">가림 60%</option>
    <option value="1" selected>가림 100%</option>
  </select>
  <select id="order">
    <option value="weak">약한 것부터</option>
    <option value="num">번호순</option>
    <option value="rand">랜덤</option>
  </select>
  <label><input type="checkbox" id="wrongOnly"> 틀린 것만</label>
  <label><input type="checkbox" id="black"> 검은 글씨도 포함</label>
  <button id="reset">🗑 초기화</button>
</nav>
<main id="app"></main>

<script>

/* ============ 로직 ============ */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isW = c => /[\p{L}\p{N}]/u.test(c);
const PASS = 85;

function parse(a){
  const segs=[], re=/\{\{([\s\S]+?)\}\}/g; let last=0, m;
  while((m=re.exec(a))){ if(m.index>last) segs.push({t:a.slice(last,m.index),b:false}); segs.push({t:m[1],b:true}); last=re.lastIndex; }
  if(last<a.length) segs.push({t:a.slice(last),b:false});
  return segs;
}
const catOf={}; Object.entries(CATS).forEach(([c,ids])=>ids.forEach(i=>catOf[i]=c));
const DATA = D.map(([id,q,a,n])=>({id,q,n,cat:catOf[id]||'기타',segs:parse(a.trim())}));

const LS='goc-progress-v2', LSS='goc-settings-v2';
let prog = JSON.parse(localStorage.getItem(LS)||'{}');
let list=[], idx=0, state='';
const save=()=>localStorage.setItem(LS,JSON.stringify(prog));
const key=d=>{const p=prog[d.id]; return !p?1:(p.b===0?0:1+p.b);};
const lvl=d=>{const p=prog[d.id]; return !p?'<span class="lv">NEW</span>':(p.b===0?'<span class="lv" style="background:#fee2e2;color:#b91c1c">❌ 틀림</span>':`<span class="lv">Lv.${p.b}</span>`);};

$('#cat').innerHTML=['전체',...Object.keys(CATS)].map(c=>`<option>${c}</option>`).join('');
const SET=['cat','mode','level','order'];
const st=JSON.parse(localStorage.getItem(LSS)||'{}');
SET.forEach(k=>{ if(st[k]) $('#'+k).value=st[k]; });
$('#black').checked=!!st.black;
const saveSet=()=>{const o={black:$('#black').checked}; SET.forEach(k=>o[k]=$('#'+k).value); localStorage.setItem(LSS,JSON.stringify(o));};

function updateStats(){
  const seen=DATA.filter(d=>prog[d.id]);
  const done=seen.filter(d=>prog[d.id].b>=3).length, wrong=seen.filter(d=>prog[d.id].b===0).length;
  $('#stats').textContent=`전체 ${DATA.length} · 외움(Lv.3+) ${done} · 틀림 ${wrong} · 미학습 ${DATA.length-seen.length}`;
  $('#pbar').style.width=(done/DATA.length*100)+'%';
}

function build(){
  saveSet();
  const c=$('#cat').value, w=$('#wrongOnly').checked, o=$('#order').value;
  list=DATA.filter(d=>(c==='전체'||d.cat===c)&&(!w||(prog[d.id]&&prog[d.id].b===0)));
  list.forEach(d=>d._r=Math.random());
  if(o==='num') list.sort((a,b)=>a.id-b.id);
  else if(o==='rand') list.sort((a,b)=>a._r-b._r);
  else list.sort((a,b)=>(key(a)-key(b))||(a._r-b._r));
  idx=0; render();
}

function clozeHTML(d,p){
  const inc=$('#black').checked, toks=[];
  d.segs.forEach(s=>s.t.split(/(\s+)/).forEach(w=>{ if(w) toks.push({w,b:s.b,el:(s.b||inc)&&[...w].some(isW)}); }));
  const el=toks.filter(t=>t.el);
  el.forEach(t=>t.h=Math.random()<p);
  if(el.length&&!el.some(t=>t.h)) el[Math.floor(Math.random()*el.length)].h=true;
  return toks.map(t=>t.h
    ?`<span class="cv${t.b?'':' k2'}" onclick="this.classList.add('open')">${esc(t.w)}</span>`
    :`<span class="${t.b?'b':'k'}">${esc(t.w)}</span>`).join('');
}

function diffHTML(d,input){
  const inc=$('#black').checked, chars=[];
  d.segs.forEach(s=>{ for(const c of s.t) chars.push({c,b:s.b,k:(s.b||inc)&&isW(c)}); });
  const T=chars.filter(x=>x.k).map(x=>x.c.toLowerCase());
  const U=[...input].filter(isW).map(c=>c.toLowerCase());
  const n=T.length, m=U.length, W=m+1, dp=new Uint16Array((n+1)*W);
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++)
    dp[i*W+j]= T[i-1]===U[j-1] ? dp[(i-1)*W+j-1]+1 : Math.max(dp[(i-1)*W+j],dp[i*W+j-1]);
  const hit=new Uint8Array(n); let i=n,j=m;
  while(i>0&&j>0){ if(T[i-1]===U[j-1]){hit[i-1]=1;i--;j--;} else if(dp[(i-1)*W+j]>=dp[i*W+j-1]) i--; else j--; }
  let k=0, html='', cur='', buf='';
  const flush=()=>{ if(buf) html+=`<span class="${cur}">${esc(buf)}</span>`; buf=''; };
  chars.forEach(x=>{ const cls=x.k?(hit[k++]?'hit':'miss'):(x.b?'b':'k'); if(cls!==cur){flush();cur=cls;} buf+=x.c; });
  flush();
  return {html, score: n? hit.reduce((a,b)=>a+b,0)/n : 1};
}

function noteHTML(d){ return d.n?`<div class="note">💡 ${esc(d.n)}</div>`:''; }

function render(){
  updateStats(); stopTTS();
  const mode=$('#mode').value;
  $('#level').style.display = mode==='type'?'none':'';
  if(!list.length){ $('#app').innerHTML='<div class="card empty">해당하는 문제가 없어요 🎉</div>'; state=''; return; }
  if(mode==='list') return renderList();
  const d=list[idx];
  const body = mode==='cloze'
    ? `<div class="a">${clozeHTML(d,+$('#level').value)}</div>`
    : `<textarea id="inp" placeholder="기억나는 대로 답을 써보세요 (Ctrl+Enter로 채점)"></textarea><div class="a" id="ans" style="display:none"></div>`;
  $('#app').innerHTML=`<div class="card">
    <div class="meta"><span>${d.cat} · ${idx+1}/${list.length}</span><span>${lvl(d)} <button class="tts" title="읽어주기" onclick="speak(${d.id})">🔊</button></span></div>
    <div class="q">${d.id}. ${esc(d.q)}</div>${body}
    <div id="noteBox"></div><div id="res" class="result"></div><div class="btns" id="btns"></div></div>`;
  setBtns(mode==='cloze'?'ask':'type');
  if(mode==='type') $('#inp').focus();
}

function renderList(){
  state='';
  const p=+$('#level').value;
  $('#app').innerHTML=`<div class="card" style="display:flex;gap:8px">
      <button style="flex:1" onclick="document.querySelectorAll('.cv').forEach(e=>e.classList.add('open'))">모두 펼치기</button>
      <button style="flex:1" onclick="document.querySelectorAll('.cv').forEach(e=>e.classList.remove('open'))">모두 가리기</button></div>`+
    list.map(d=>`<div class="card"><div class="meta"><span>${d.cat}</span><span>${lvl(d)} <button class="tts" onclick="speak(${d.id})">🔊</button></span></div>
      <div class="q">${d.id}. ${esc(d.q)}</div><div class="a">${clozeHTML(d,p)}</div>${noteHTML(d)}</div>`).join('');
}

function setBtns(s){
  state=s;
  const B={
    ask:`<button onclick="reveal()">전부 보기 (Space)</button>`,
    judge:`<button class="no" onclick="mark(false)">몰랐음 (1)</button><button class="yes" onclick="mark(true)">알았음 (2)</button>`,
    type:`<button class="sub" onclick="giveUp()">모르겠음</button><button onclick="grade()">채점 (Ctrl+Enter)</button>`,
    next:`<button class="sub" onclick="render()">다시 쓰기</button><button onclick="next()">다음 (Enter)</button>`
  };
  $('#btns').innerHTML=B[s];
}

function reveal(){
  document.querySelectorAll('.cv').forEach(e=>e.classList.add('open'));
  $('#noteBox').innerHTML=noteHTML(list[idx]);
  setBtns('judge');
}

function record(ok){
  const d=list[idx], p=prog[d.id]||{b:0,n:0,w:0};
  p.n++; if(ok) p.b=Math.min(5,p.b+1); else { p.b=0; p.w++; }
  prog[d.id]=p; save();
}
function mark(ok){ record(ok); next(); }

function grade(){
  const d=list[idx], {html,score}=diffHTML(d,$('#inp').value);
  const pct=Math.round(score*100), ok=pct>=PASS;
  $('#ans').innerHTML=html; $('#ans').style.display='block'; $('#inp').readOnly=true;
  record(ok);
  $('#res').innerHTML=`${ok?'✅':'❌'} 일치율 ${pct}% <span style="font-weight:400;color:#64748b">(${PASS}% 이상 통과 · 빨간 부분 = 빠뜨리거나 틀린 곳)</span>`;
  $('#noteBox').innerHTML=noteHTML(d);
  setBtns('next'); document.activeElement.blur();
}
function giveUp(){ $('#inp').value=''; grade(); }

function next(){
  idx++;
  if(idx>=list.length){
    updateStats(); state='';
    $('#app').innerHTML=`<div class="card empty">🎉 한 바퀴 완료!<br><br><button onclick="build()">다시 하기 (약한 문제부터)</button></div>`;
  } else render();
}

function speak(id){
  if(!('speechSynthesis' in window)) return alert('이 브라우저는 음성 읽기를 지원하지 않아요');
  if(speechSynthesis.speaking){ speechSynthesis.cancel(); return; }
  const d=DATA.find(x=>x.id===id);
  const txt=d.segs.map(s=>s.t).join('').replace(/×/g,' ').replace(/→/g,', ').replace(/[<>\[\]]/g,' ');
  const u=new SpeechSynthesisUtterance(d.q+' ... '+txt); u.lang='ko-KR'; u.rate=1;
  speechSynthesis.speak(u);
}
function stopTTS(){ if('speechSynthesis' in window) speechSynthesis.cancel(); }

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT') return;
  if(state==='type'){ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); grade(); } return; }
  if(state==='ask'&&e.code==='Space'){ e.preventDefault(); reveal(); }
  else if(state==='judge'&&(e.key==='1'||e.key==='2')) mark(e.key==='2');
  else if(state==='next'&&e.key==='Enter'){ e.preventDefault(); next(); }
});

['cat','mode','level','order','wrongOnly','black'].forEach(k=>$('#'+k).onchange=build);
$('#reset').onclick=()=>{ if(confirm('학습 기록을 모두 지울까요?')){ prog={}; save(); build(); } };
build();
</script>
